name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    # The first entry is the development version from .nvmrc and keeps the
    # plain "Verify" name, which the main-branch ruleset requires and
    # scripts/release-sdk-bump.sh waits on. The others prove the supported
    # Node range that package.json `engines.node` promises: its floor, and
    # the LTS line between the floor and the development version. Raise the
    # floor here and in `engines.node` together, as a deliberate change.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Verify
            node-version-file: .nvmrc
          - name: Verify (Node 22)
            node-version: '22'
          - name: Verify (Node 24)
            node-version: '24'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify package
        run: node scripts/verify-package.mjs
